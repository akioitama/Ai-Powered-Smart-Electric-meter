# Optional production reverse proxy (HTTPS termination + WS pass-through).
# Mount real certs and run on host or as a service in compose for prod.

events {}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  client_max_body_size 10m;

  upstream aimeter_backend { server backend:8000; }
  upstream aimeter_frontend { server frontend:3000; }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://aimeter_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      proxy_pass http://aimeter_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://aimeter_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
