name: aimeter

services:
  postgres:
    image: postgres:16-alpine
    container_name: aimeter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aimeter
      POSTGRES_PASSWORD: aimeter
      POSTGRES_DB: aimeter
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimeter -d aimeter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aimeter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aimeter-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aimeter-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://aimeter:aimeter@postgres:5432/aimeter
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      JWT_SECRET: change-me-in-prod
      ADMIN_EMAIL: admin@aimeter.local
      ADMIN_PASSWORD: admin1234
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"

  mqtt_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aimeter-mqtt-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://aimeter:aimeter@postgres:5432/aimeter
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      JWT_SECRET: change-me-in-prod
    command: ["python", "-m", "app.workers.mqtt_worker"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aimeter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-prod
      INTERNAL_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pg_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
